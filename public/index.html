<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Ai Bug Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(18, 22, 38, 0.85);
            --cyan: #00f2fe;
            --blue: #4facfe;
            --red: #ff3366;
            --green: #00ff88;
            --violet: #b537f2;
            --yellow: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #171d3d 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 242, 254, 0.05);
            backdrop-filter: blur(14px);
            padding: 24px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top neon border glow */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            box-shadow: 0 0 12px var(--cyan);
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--green);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: var(--green);
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 7px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: #6d7d9c;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .period-card {
            background: rgba(10, 14, 28, 0.85);
            border: 1px dashed rgba(79, 172, 254, 0.4);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .period-label {
            font-size: 11px;
            color: #7f8fa4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .period-value {
            font-family: 'Orbitron', monospace;
            font-size: 19px;
            font-weight: 800;
            color: var(--cyan);
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .prediction-box {
            background: radial-gradient(circle at center, rgba(30, 39, 73, 0.4) 0%, rgba(13, 17, 33, 0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 10px;
            margin-bottom: 18px;
        }

        .prediction-label {
            font-size: 12px;
            color: #8fa0be;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .prediction-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 6px 0;
            transition: all 0.3s ease;
        }

        .outcome-BIG {
            color: var(--red);
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }

        .outcome-SMALL {
            color: var(--green);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .info-card {
            background: rgba(12, 16, 32, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .info-card .label {
            font-size: 11px;
            color: #6f809d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card .val {
            font-size: 17px;
            font-weight: 700;
            margin-top: 4px;
        }

        .color-Violet { color: var(--violet); text-shadow: 0 0 10px rgba(181, 55, 242, 0.5); }
        .color-Red { color: var(--red); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        .color-Green { color: var(--green); text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }

        .digits-val {
            color: var(--yellow);
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .tg-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00aaff 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tg-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3);
        }

        .tg-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge-live">
            <span class="dot"></span> AI Engine Live
        </div>

        <h1 class="title">Prediction Ai Bug Tool</h1>
        <div class="subtitle">WinGo 1M Real-Time Analyser</div>

        <div class="period-card">
            <div class="period-label">Current Running Period</div>
            <div class="period-value" id="period">Loading...</div>
        </div>

        <div class="prediction-box">
            <div class="prediction-label">Next Period Signal</div>
            <div class="prediction-value" id="outcome">--</div>
        </div>

        <div class="grid-info">
            <div class="info-card">
                <div class="label">Color</div>
                <div class="val" id="color">--</div>
            </div>
            <div class="info-card">
                <div class="label">Expected Digits</div>
                <div class="val digits-val" id="digits">--</div>
            </div>
        </div>

        <a href="https://t.me/+oHg4pES6QoBmMTM1" target="_blank" rel="noopener noreferrer" class="tg-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
            </svg>
            Join Telegram Channel
        </a>
    </div>

    <script>
        async function fetchPrediction() {
            try {
                const res = await fetch('/api/predict');
                const data = await res.json();

                if (!data.error) {
                    document.getElementById('period').innerText = data.current_period;

                    const outcomeElem = document.getElementById('outcome');
                    outcomeElem.innerText = data.big_small;
                    outcomeElem.className = 'prediction-value outcome-' + data.big_small;

                    const colorElem = document.getElementById('color');
                    colorElem.innerText = data.color;
                    colorElem.className = 'val color-' + data.color;

                    document.getElementById('digits').innerText = data.expected_digits.join(', ');
                }
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        // Instant fetch and auto-refresh every 5 seconds
        fetchPrediction();
        setInterval(fetchPrediction, 5000);
    </script>
</body>
</html>
